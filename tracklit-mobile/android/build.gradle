// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

configurations.all {
//        exclude group: 'com.android.support', module: 'versionedparcelable'
        exclude group: 'com.android.support', module: 'startup-runtime'

        resolutionStrategy {
            // Pin AndroidX Core to a version compatible with AGP 8.2 and compileSdk 34
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            dependencySubstitution {
                substitute module('com.android.support:versionedparcelable') using module('androidx.versionedparcelable:versionedparcelable:1.1.1')
                substitute module('com.android.support:localbroadcastmanager') using module('androidx.localbroadcastmanager:localbroadcastmanager:1.1.0')
                substitute module('com.android.support:support-v4') using module('androidx.legacy:legacy-support-v4:1.0.0')
                substitute module('com.android.support:appcompat-v7') using module('androidx.appcompat:appcompat:1.6.1')
            }
        }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
