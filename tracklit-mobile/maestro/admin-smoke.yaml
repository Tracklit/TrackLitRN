appId: com.tracklit.app
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to TrackLit"
- tapOn:
    point: "50%,34%"
- inputText: ${E2E_ADMIN_IDENTIFIER}
- tapOn:
    point: "50%,47%"
- inputText: ${E2E_ADMIN_PASSWORD}
- tapOn: "Log In"
- assertVisible: "Sprinthia"
- tapOn: "Open menu"
- tapOn: "Admin Panel"
- assertVisible: "Admin Panel"
- assertVisible: "Secure web session"
- assertVisible: "Loading admin panel..."
- assertNotVisible: "Loading admin panel..."
- assertNotVisible: "Admin panel returned 404."
- assertNotVisible: "Unable to load the admin panel."
- assertNotVisible: "You need to sign in again before opening the admin panel."
