appId: com.tracklit.app
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to TrackLit"
- tapOn:
    point: "50%,34%"
- inputText: ${E2E_USER_IDENTIFIER}
- tapOn:
    point: "50%,47%"
- inputText: ${E2E_USER_PASSWORD}
- tapOn: "Log In"
- assertVisible: "Sprinthia"
- tapOn: "Open menu"
- tapOn: "Rehabilitation"
- assertVisible: "Rehabilitation Center"
- tapOn: "Start AI Consultation"
- assertVisible: "Recovery-first guidance"
- back
- assertVisible: "Rehabilitation Center"
- back
- assertVisible: "Sprinthia"
- tapOn: "Open menu"
- tapOn: "Spikes"
- assertVisible: "What are Spikes?"
- tapOn: "What are Spikes?"
- assertVisible: "Unlock Tiers"
- back
- tapOn: "My Progress"
- assertVisible: "Login Streak"
- back
- back
- tapOn: "Open menu"
- tapOn: "Notifications"
- assertVisible: "Notifications"
